<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legendary DVD Bounce</title>

<style>
* { box-sizing: border-box; }

body {
margin: 0;
height: 100vh;
overflow: hidden;
background: radial-gradient(circle at top, #1a1a1a, #000);
font-family: "Segoe UI", Arial, sans-serif;
color: white;
}

/* HUD */
.hud {
position: fixed;
top: 16px;
left: 50%;
transform: translateX(-50%);
display: flex;
align-items: center;
gap: 14px;
padding: 10px 18px;
background: rgba(0,0,0,0.35);
backdrop-filter: blur(14px) saturate(140%);
border-radius: 999px;
border: 1px solid rgba(255,255,255,0.08);
box-shadow: 0 8px 30px rgba(0,0,0,0.8);
z-index: 10;
}

.clock {
font-size: 1.2rem;
letter-spacing: 1px;
opacity: 0.9;
}

.timer {
font-size: 0.85rem;
opacity: 0.55;
min-width: 52px;
}

.controls {
display: flex;
gap: 8px;
}

button {
width: 28px;
height: 28px;
border-radius: 50%;
border: none;
background: rgba(255,255,255,0.08);
color: white;
font-size: 1.1rem;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
}

button:hover {
background: rgba(255,255,255,0.18);
}

/* DVD */
.dvd {
position: absolute;
width: 140px;
height: 80px;
border-radius: 12px;
display: flex;
align-items: center;
justify-content: center;
font-weight: 800;
font-size: 1.4rem;
letter-spacing: 2px;
opacity: 0.75;
mix-blend-mode: screen;
box-shadow: 0 0 25px rgba(255,255,255,0.35);
user-select: none;
z-index: 5;
}

/* Fireworks */
canvas {
position: fixed;
inset: 0;
pointer-events: none;
z-index: 2;
}
</style>
</head>

<body>

<div class="hud">
<div class="clock" id="clock">00:00:00</div>
<div class="timer" id="timer">00:00</div>
<div class="controls">
<button onclick="speedUp()">+</button>
<button onclick="slowDown()">−</button>
</div>
</div>

<canvas id="fx"></canvas>
<div class="dvd" id="dvd">DVD</div>

<script>
/* CLOCK */
function updateClock() {
document.getElementById("clock").textContent =
new Date().toLocaleTimeString();
}
setInterval(updateClock, 1000);
updateClock();

/* STOPWATCH */
let secondsOnSite = 0;
setInterval(() => {
secondsOnSite++;
const m = String(Math.floor(secondsOnSite / 60)).padStart(2, "0");
const s = String(secondsOnSite % 60).padStart(2, "0");
document.getElementById("timer").textContent = `${m}:${s}`;
}, 1000);

/* AUDIO (click once to enable) */
let audioCtx;
document.body.addEventListener("click", () => {
if (!audioCtx)
audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}, { once: true });

function playClap() {
if (!audioCtx) return;
const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.2, audioCtx.sampleRate);
const data = buffer.getChannelData(0);
for (let i = 0; i < data.length; i++) {
data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
}
const src = audioCtx.createBufferSource();
src.buffer = buffer;
src.connect(audioCtx.destination);
src.start();
}

/* FIREWORKS */
const canvas = document.getElementById("fx");
const ctx = canvas.getContext("2d");

function resize() {
canvas.width = innerWidth;
canvas.height = innerHeight;
}
resize();
window.addEventListener("resize", resize);

const particles = [];

function firework(x, y, color) {
for (let i = 0; i < 60; i++) {
particles.push({
x, y,
vx: (Math.random() - 0.5) * 8,
vy: (Math.random() - 0.5) * 8,
life: 60,
color
});
}
}

function updateParticles() {
ctx.clearRect(0, 0, canvas.width, canvas.height);
for (let i = particles.length - 1; i >= 0; i--) {
const p = particles[i];
p.x += p.vx;
p.y += p.vy;
p.vy += 0.05;
p.life--;
ctx.fillStyle = p.color;
ctx.globalAlpha = p.life / 60;
ctx.fillRect(p.x, p.y, 3, 3);
if (p.life <= 0) particles.splice(i, 1);
}
ctx.globalAlpha = 1;
requestAnimationFrame(updateParticles);
}
updateParticles();

/* DVD BOUNCE */
const dvd = document.getElementById("dvd");
let x = Math.random() * (innerWidth - 140);
let y = Math.random() * (innerHeight - 80);
let speed = 2.5;
let dx = speed;
let dy = speed;

const colors = ["#ff004c", "#00eaff", "#00ff6a", "#ffd500", "#a855f7", "#ff7a00"];
const randColor = () => colors[Math.floor(Math.random() * colors.length)];

dvd.style.background = randColor();

function speedUp() {
speed += 0.5;
dx = Math.sign(dx) * speed;
dy = Math.sign(dy) * speed;
}

function slowDown() {
speed = Math.max(0.5, speed - 0.5);
dx = Math.sign(dx) * speed;
dy = Math.sign(dy) * speed;
}

function animate() {
x += dx;
y += dy;
let hitX = false;
let hitY = false;

if (x <= 0 || x + 140 >= innerWidth) {
dx *= -1;
hitX = true;
}
if (y <= 0 || y + 80 >= innerHeight) {
dy *= -1;
hitY = true;
}

if (hitX || hitY) {
const c = randColor();
dvd.style.background = c;
dvd.style.boxShadow = `0 0 30px ${c}`;
}

if (hitX && hitY) {
firework(x + 70, y + 40, dvd.style.background);
playClap();
}

dvd.style.transform = `translate(${x}px, ${y}px)`;
requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
